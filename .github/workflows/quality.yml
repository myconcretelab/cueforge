name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier la publication
        run: npm run release:check
      - name: Vérifier les types
        run: npm run typecheck
      - name: Vérifier le style du code
        run: npm run lint
      - name: Exécuter les tests
        run: npm test
      - name: Compiler l’application et la documentation
        run: npm run build
