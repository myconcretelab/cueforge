services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soundflow
      POSTGRES_USER: soundflow
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - soundflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundflow -d soundflow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  soundflow-postgres:
