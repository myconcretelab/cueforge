services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: s1
      POSTGRES_USER: s1
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - s1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s1 -d s1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  s1-postgres:
